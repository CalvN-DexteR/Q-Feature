[project]
name = "q-feature"
version = "0.1.0"
description = "Q-FEATURE: Quantum QUBO + QAOA Robust Feature Selection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pandas>=2.2.0",
    "qiskit>=1.0.0",
    "qiskit-aer>=0.17.0",
    "qiskit-algorithms>=0.4.0",
    "qiskit-optimization>=0.7.0",
    "requests>=2.30.0",
    "scikit-learn>=1.7.0",
    "scipy>=1.15.0",
    "scipy-stubs>=1.15.3.0",
    "xgboost>=3.0.0",
]

[tool.uv]
package = false

[tool.pyrefly]
search-path = [".", "src", ".venv/Lib/site-packages"]
python-interpreter-path = ".venv/Scripts/python.exe"
